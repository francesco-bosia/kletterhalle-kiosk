# WiFi Configuration for Raspberry Pi
#
# Copy this file to /boot/wpa_supplicant.conf before first boot
# The system will automatically move it to the correct location
#
# Replace YOUR_WIFI_NAME and YOUR_WIFI_PASSWORD with your credentials

country=CH
ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1

network={
    ssid="YOUR_WIFI_NAME"
    psk="YOUR_WIFI_PASSWORD"
    scan_ssid=1
}

# For multiple networks, add additional network blocks:
# network={
#     ssid="BACKUP_WIFI"
#     psk="BACKUP_PASSWORD"
# }
